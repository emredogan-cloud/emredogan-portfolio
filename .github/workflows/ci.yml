name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── 1. Static quality ──────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Dead code / unused dependencies
        run: pnpm knip

  # ── 2. Unit tests ──────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── 3. Build + bundle budget ───────────────────────────────────────────────
  build:
    name: Build · Bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enforce first-load budget
        run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          retention-days: 3

  # ── 4-6. Browser tests: E2E, accessibility, visual regression ──────────────
  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      # Browser binaries are 100-350 MB each and never change within a
      # Playwright release. Caching them removes the download entirely on
      # repeat runs.
      - name: Restore browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.project }}

      # Split deliberately. `playwright install --with-deps` shells out to
      # apt-get, which stalled for 25 minutes on a hosted runner and took the
      # whole job down with it. Separating the two gives the system packages
      # their own short timeout and one retry, while the browser binary comes
      # from cache and cannot be affected by a slow apt mirror.
      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if pnpm exec playwright install-deps ${{ matrix.project }}; then
              exit 0
            fi
            echo "::warning::playwright install-deps attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Install browser binary
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install ${{ matrix.project }}

      - name: E2E
        run: pnpm exec playwright test --project=${{ matrix.project }} tests/e2e
      - name: Accessibility (axe · WCAG 2.2 AA · zero violations)
        run: pnpm exec playwright test --project=${{ matrix.project }} tests/a11y
      - name: Visual regression
        if: matrix.project == 'chromium'
        run: pnpm exec playwright test --project=chromium tests/visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── 7. Performance budget ──────────────────────────────────────────────────
  performance:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ── 8. Security ────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # ── 9. Gate ────────────────────────────────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, unit, build, browser, performance, security]
    steps:
      # Written as "every result must be success" rather than a grep for
      # "failure". `grep -q X && exit 1` is ambiguous under `bash -e`: it can
      # fail the step when the pattern is absent, which is the opposite of the
      # intent, and it silently misses results like "cancelled" or "skipped".
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          not_success=$(echo "$RESULTS" | grep -o '"result": *"[a-z_]*"' | grep -vc '"success"' || true)
          if [ "$not_success" -ne 0 ]; then
            echo "::error::$not_success required job(s) did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
